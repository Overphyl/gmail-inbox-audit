<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="600" fill="#1f2328">Steps 5 &amp; 9 — the scope must be declared, then verified against the API</text>
  <text x="24" y="53" font-size="12.5" fill="#656d76">This pair causes the most confusing failure in the whole setup.</text>

  <!-- declare -->
  <rect x="24" y="76" width="400" height="150" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="102" font-size="13" font-weight="600" fill="#1f2328">Data Access → Add or remove scopes</text>
  <rect x="44" y="116" width="360" height="34" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="56" y="137" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#0969da">.../auth/gmail.modify</text>
  <text x="44" y="176" font-size="11.5" fill="#656d76">Restricted scopes not declared here are dropped</text>
  <text x="44" y="193" font-size="11.5" fill="#656d76">at consent — silently, with no error shown.</text>
  <text x="44" y="214" font-size="11.5" font-weight="600" fill="#cf222e">Skip this and every Gmail call returns 403.</text>

  <!-- consent checkbox -->
  <rect x="456" y="76" width="400" height="150" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="476" y="102" font-size="13" font-weight="600" fill="#1f2328">At the consent screen — tick the box</text>
  <rect x="476" y="116" width="360" height="42" rx="5" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <rect x="490" y="130" width="14" height="14" rx="3" fill="#1a7f37"/>
  <path d="M493,137 l3,3 l6,-6" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="514" y="136" font-size="11" fill="#1f2328">Read, compose, send and permanently</text>
  <text x="514" y="150" font-size="11" fill="#1f2328">delete all your email from Gmail</text>
  <text x="476" y="184" font-size="11.5" fill="#656d76">Google lets you consent while leaving optional</text>
  <text x="476" y="201" font-size="11.5" fill="#656d76">scopes unchecked — producing a token that</text>
  <text x="476" y="218" font-size="11.5" font-weight="600" fill="#cf222e">looks fine and fails every call.</text>

  <!-- the lie -->
  <rect x="24" y="248" width="832" height="164" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="44" y="276" font-size="14" font-weight="600" fill="#cf222e">`gws auth status` reports REQUESTED scopes, not GRANTED ones</text>

  <rect x="44" y="292" width="380" height="100" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="58" y="314" font-size="11.5" font-weight="600" fill="#656d76">What it shows you</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#1f2328">
    <text x="58" y="336">$ gws auth status</text>
    <text x="58" y="353">  "scope_count": 6</text>
    <text x="58" y="370">  - .../auth/gmail.modify</text>
  </g>
  <text x="300" y="370" font-size="11.5" font-weight="600" fill="#cf222e">looks correct</text>

  <rect x="456" y="292" width="380" height="100" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="470" y="314" font-size="11.5" font-weight="600" fill="#656d76">What the API says</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#1f2328">
    <text x="470" y="336">$ gws gmail users getProfile …</text>
    <text x="470" y="353" fill="#cf222e">  403 insufficientPermissions</text>
    <text x="470" y="370" fill="#1a7f37">  ✓ or your address + totals</text>
  </g>

  <text x="44" y="406" font-size="12" font-weight="600" fill="#1f2328">Only the right-hand check is trustworthy. Always verify with a real API call.</text>
</svg>
