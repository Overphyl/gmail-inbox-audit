<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">Setup flow — which steps are terminal, which are browser</text>
  <text x="24" y="56" font-size="12.5" fill="#656d76">Roughly half cannot be automated. The browser steps are where people get stuck.</text>

  <!-- lane labels -->
  <rect x="24" y="82" width="112" height="118" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="80" y="132" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Terminal</text>
  <text x="80" y="150" font-size="11" fill="#656d76" text-anchor="middle">automated</text>

  <rect x="24" y="216" width="112" height="118" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="80" y="266" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Browser</text>
  <text x="80" y="284" font-size="11" fill="#656d76" text-anchor="middle">manual</text>

  <!-- terminal steps -->
  <g>
    <rect x="156" y="92" width="128" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="220" y="116" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">1. Install</text>
    <text x="220" y="134" font-size="11" fill="#656d76" text-anchor="middle">node, python, gcloud</text>

    <rect x="300" y="92" width="128" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="364" y="116" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">2. gcloud login</text>
    <text x="364" y="134" font-size="11" fill="#656d76" text-anchor="middle">+ set project</text>

    <rect x="444" y="92" width="128" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="508" y="116" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">3. gws auth setup</text>
    <text x="508" y="134" font-size="11" fill="#656d76" text-anchor="middle">enables the APIs</text>

    <rect x="732" y="92" width="124" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="794" y="116" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">8. gws auth login</text>
    <text x="794" y="134" font-size="11" fill="#656d76" text-anchor="middle">--scopes …modify</text>
  </g>

  <!-- browser steps -->
  <g>
    <rect x="300" y="226" width="128" height="60" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="364" y="250" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">4. Consent screen</text>
    <text x="364" y="268" font-size="11" fill="#656d76" text-anchor="middle">+ add Test user</text>

    <rect x="444" y="226" width="128" height="60" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="508" y="250" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">5. Data Access</text>
    <text x="508" y="268" font-size="11" fill="#656d76" text-anchor="middle">declare gmail.modify</text>

    <rect x="588" y="226" width="128" height="60" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="652" y="250" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">6+7. OAuth client</text>
    <text x="652" y="268" font-size="11" fill="#656d76" text-anchor="middle">Desktop app → JSON</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#8c959f"/>
    </marker>
  </defs>
  <g stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M284,122 H296"/>
    <path d="M428,122 H440"/>
    <path d="M508,152 V186 H364 V220"/>
    <path d="M428,256 H440"/>
    <path d="M572,256 H584"/>
    <path d="M716,256 H756 V158"/>
  </g>

  <!-- setup stops note -->
  <rect x="596" y="96" width="120" height="52" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-dasharray="4 3"/>
  <text x="656" y="116" font-size="10.5" font-weight="600" fill="#cf222e" text-anchor="middle">setup STOPS here</text>
  <text x="656" y="130" font-size="10" fill="#656d76" text-anchor="middle">cannot create the</text>
  <text x="656" y="142" font-size="10" fill="#656d76" text-anchor="middle">OAuth client</text>
  <path d="M572,122 H592" stroke="#cf222e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- verify -->
  <rect x="588" y="322" width="268" height="52" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="722" y="343" font-size="12.5" font-weight="600" fill="#1a7f37" text-anchor="middle">9. Verify with a real API call</text>
  <text x="722" y="361" font-size="11" fill="#1f2328" text-anchor="middle">gws gmail users getProfile — not `gws auth status`</text>
  <path d="M794,158 V316" stroke="#8c959f" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
</svg>
