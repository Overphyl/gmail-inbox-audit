<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="600" fill="#1f2328">Step 4 — Consent screen / Branding</text>
  <text x="24" y="53" font-size="12.5" fill="#656d76">Google Auth Platform → Branding &amp; Audience</text>

  <!-- form panel -->
  <rect x="24" y="72" width="500" height="374" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- User type -->
  <text x="44" y="102" font-size="11.5" fill="#656d76">User Type</text>
  <rect x="44" y="110" width="200" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <circle cx="60" cy="125" r="5" fill="#1a7f37"/>
  <text x="74" y="129" font-size="12.5" font-weight="600" fill="#1f2328">External</text>
  <text x="256" y="129" font-size="11.5" fill="#1a7f37">← required</text>

  <!-- App name -->
  <text x="44" y="168" font-size="11.5" fill="#656d76">App name</text>
  <rect x="44" y="176" width="300" height="30" rx="5" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="56" y="196" font-size="12.5" fill="#1f2328">gws CLI</text>
  <text x="356" y="196" font-size="11.5" fill="#1a7f37">← anything</text>

  <!-- support email -->
  <text x="44" y="230" font-size="11.5" fill="#656d76">User support email</text>
  <rect x="44" y="238" width="300" height="30" rx="5" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="56" y="258" font-size="12.5" fill="#1f2328">you@gmail.com</text>

  <!-- the three traps -->
  <text x="44" y="298" font-size="11.5" font-weight="600" fill="#cf222e">App domain — LEAVE ALL THREE BLANK</text>

  <g>
    <rect x="44" y="308" width="300" height="26" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="56" y="325" font-size="11.5" fill="#cf222e">Application home page</text>
    <line x1="52" y1="321" x2="336" y2="321" stroke="#cf222e" stroke-width="1.2"/>

    <rect x="44" y="340" width="300" height="26" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="56" y="357" font-size="11.5" fill="#cf222e">Privacy policy link</text>
    <line x1="52" y1="353" x2="336" y2="353" stroke="#cf222e" stroke-width="1.2"/>

    <rect x="44" y="372" width="300" height="26" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="56" y="389" font-size="11.5" fill="#cf222e">Terms of service link</text>
    <line x1="52" y1="385" x2="336" y2="385" stroke="#cf222e" stroke-width="1.2"/>
  </g>

  <!-- test users -->
  <text x="44" y="428" font-size="11.5" fill="#656d76">Test users</text>
  <rect x="120" y="412" width="230" height="26" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="132" y="429" font-size="11.5" font-weight="600" fill="#0969da">+ ADD your own address</text>

  <!-- right column callouts -->
  <rect x="548" y="72" width="308" height="150" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="566" y="98" font-size="13" font-weight="600" fill="#cf222e">The authorized-domain trap</text>
  <text x="566" y="122" font-size="11.5" fill="#1f2328">Fill in ANY of those three URL fields</text>
  <text x="566" y="139" font-size="11.5" fill="#1f2328">and Google demands an "authorized</text>
  <text x="566" y="156" font-size="11.5" fill="#1f2328">domain" — a domain you own and have</text>
  <text x="566" y="173" font-size="11.5" fill="#1f2328">verified. localhost and IPs are rejected.</text>
  <text x="566" y="197" font-size="11.5" font-weight="600" fill="#cf222e">Leave them blank → requirement gone.</text>
  <text x="566" y="213" font-size="11" fill="#656d76">The desktop flow uses 127.0.0.1 anyway.</text>

  <rect x="548" y="238" width="308" height="112" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="566" y="264" font-size="13" font-weight="600" fill="#0969da">Test user is not optional</text>
  <text x="566" y="288" font-size="11.5" fill="#1f2328">Omit your own address here and login</text>
  <text x="566" y="305" font-size="11.5" fill="#1f2328">fails with:</text>
  <rect x="566" y="314" width="150" height="22" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="576" y="329" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#cf222e">access_denied</text>

  <rect x="548" y="366" width="308" height="96" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="566" y="392" font-size="12.5" font-weight="600" fill="#1f2328">Why blank is safe</text>
  <text x="566" y="414" font-size="11.5" fill="#656d76">These fields appear on the consent screen</text>
  <text x="566" y="431" font-size="11.5" fill="#656d76">shown to external users. In Testing, with</text>
  <text x="566" y="448" font-size="11.5" fill="#656d76">only you, nobody ever sees them.</text>
</svg>
